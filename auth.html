<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход и регистрация — SoundCraft</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section class="section">
    <div class="auth-wrap">
      <h1 id="authTitle">Вход в аккаунт</h1>
      <div class="form-msg" id="msg"></div>

      <form id="authForm">
        <div class="field" id="regNameField" style="display:none"><label>ФИО
          <span class="help">?<span class="tip">ФИО используется для адреса доставки и обращений к вам. После регистрации в аккаунте отображается только ваше имя — остальное останется в профиле.</span></span>
        </label>
          <input type="text" id="regName" placeholder="Фамилия Имя Отчество"></div>
        <div class="field"><label>Email</label>
          <input type="email" id="email" placeholder="you@example.ru" required></div>
        <div class="field"><label>Пароль</label>
          <input type="password" id="pass" placeholder="Минимум 5 символов" required></div>
        <button class="btn btn--block" type="submit" id="submitBtn">Войти</button>
      </form>

      <div class="auth-link" id="toggleLink"></div>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    renderPage();

    let mode = "login"; // login | register
    const emailEl = document.getElementById("email");
    const passEl = document.getElementById("pass");

    function renderForm(){
      const isLogin = mode==="login";
      document.getElementById("authTitle").textContent = isLogin ? "Вход в аккаунт" : "Регистрация";
      document.getElementById("regNameField").style.display = isLogin ? "none" : "block";
      document.getElementById("submitBtn").textContent = isLogin ? "Войти" : "Создать аккаунт";
      document.getElementById("toggleLink").innerHTML = isLogin
        ? "Нет аккаунта? <a href=\"#\" onclick=\"return switchMode(event)\">Зарегистрироваться</a>"
        : "Уже есть аккаунт? <a href=\"#\" onclick=\"return switchMode(event)\">Войти</a>";
    }
    window.switchMode = function(e){
      e.preventDefault();
      mode = mode==="login" ? "register" : "login";
      renderForm();
      return false;
    };

    function showMsg(text, ok){
      const m = document.getElementById("msg");
      m.className = "form-msg show " + (ok ? "form-msg--ok" : "form-msg--err");
      m.textContent = text;
    }

    document.getElementById("authForm").addEventListener("submit", e=>{
      e.preventDefault();
      const email = emailEl.value.trim().toLowerCase();
      const pass = passEl.value;
      const name = document.getElementById("regName").value.trim();

      if(pass.length < 5){ showMsg("Пароль должен быть не короче 5 символов"); return; }

      let users = getUsers();

      if(mode==="register"){
        if(!name){ showMsg("Укажите ФИО"); return; }
        if(email===ADMIN_EMAIL){ showMsg("Этот email зарезервирован для администратора"); return; }
        if(users.some(u=>u.email===email)){ showMsg("Пользователь с таким email уже существует. Войдите."); mode="login"; renderForm(); return; }
        const fullName = name.trim();
        const parts = fullName.split(/\s+/);
        const firstName = parts.length>1 ? parts[1] : parts[0]; // показываем имя (в ФИО оно второе), а не фамилию
        users.push({name: fullName, email, pass});
        setUsers(users);
        setCurrentUser({name: firstName, email});
        toast("Аккаунт создан. Добро пожаловать, " + firstName + "!");
        showMsg("Регистрация успешна! Вы вошли в аккаунт.", true);
        setTimeout(()=>location.href="index.html", 900);
        return;
      }

      if(window.adminCreds && window.adminCreds(email, pass)){
        window.grantAdmin();
        showMsg("Вход администратора выполнен.", true);
        setTimeout(()=>location.href="admin.html", 900);
        return;
      }

      const user = users.find(u=>u.email===email && u.pass===pass);
      if(!user){ showMsg("Неверный email или пароль"); return; }
      setCurrentUser({name:user.name, email:user.email});
      toast("С возвращением, " + user.name + "!");
      showMsg("Вы вошли в аккаунт.", true);
      setTimeout(()=>location.href="index.html", 900);
    });

    renderForm();
  </script>
</body>
</html>
