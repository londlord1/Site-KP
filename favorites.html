<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Избранное — SoundCraft</title>
  <meta name="description" content="Избранные товары интернет-магазина музыкальных инструментов">
  <link rel="stylesheet" href="css/style.css?v=14">
</head>
<body>
  <section class="section">
    <div class="container">
      <h1 style="margin:0 0 20px">Избранное</h1>
      <div class="grid grid--cards" id="favList"></div>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    renderPage("favorites.html");
    renderFavCount();
    renderUserChip();
    initSearch();

    const box = document.getElementById("favList");
    function renderFavs(){
      const favs = getFavs();
      const items = PRODUCTS.filter(p=>favs.includes(p.id));
      if(!items.length){
        box.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-ico">♥</div>В избранном пока пусто.<br><a class="btn btn--sm" style="margin-top:14px" href="catalog.html">Перейти в каталог</a></div>`;
        return;
      }
      box.innerHTML = items.map(p=>`
        <article class="card">
          <a class="card__img" href="product.html?id=${p.id}">
            <span class="card__icon">${p.icon}</span>
            ${p.img?`<img class="card__photo" src="${p.img}" alt="${escapeHtml(p.name)}" loading="lazy" onerror="this.remove()">`:""}
            ${favBtn(p.id)}
          </a>
          <div class="card__body">
            <span class="card__cat">${escapeHtml(p.cat)}</span>
            <a class="card__name" href="product.html?id=${p.id}">${escapeHtml(p.name)}</a>
            <div class="card__price">${fmtPrice(p.price)} ${p.oldPrice?`<s class="card__old">${fmtPrice(p.oldPrice)}</s>`:""}</div>
            <div class="card__row">
              <button class="btn--buy" data-id="${p.id}" onclick="buyToggle(this)">В корзину</button>
              <a class="btn--view" href="product.html?id=${p.id}">Подробнее</a>
            </div>
          </div>
        </article>`).join("");
    }

    loadProducts().then(()=>{ fillSearchCats(); renderFavs(); });
  </script>
</body>
</html>
