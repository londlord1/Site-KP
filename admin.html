<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — SoundCraft</title>
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <section class="section">
    <div class="container" id="adminWrap">
      <div class="empty">Загрузка...</div>
    </div>
  </section>

  <script src="js/data.js?v=2"></script>
  <script src="js/api.js?v=2"></script>
  <script src="js/main.js?v=2"></script>
  <script>
    renderPage("admin.html");
    renderCartCount();
    renderUserChip();

    // ---------- Вход в админку (admin@ya.ru / admin@ya.ru) ----------
    window.isAdmin = () => sessionStorage.getItem("sc_admin")==="1";

    const wrap = document.getElementById("adminWrap");

    function loginScreen(){
      wrap.innerHTML = `
      <div class="auth-wrap">
        <h1>Вход в админ-панель</h1>
        <div class="form-msg" id="amsg"></div>
        <form id="alform">
          <div class="field"><label>Email</label><input type="email" id="alogin" autocomplete="username" placeholder="admin@ya.ru"></div>
          <div class="field"><label>Пароль</label><input type="password" id="apass" autocomplete="current-password" placeholder="admin@ya.ru"></div>
          <button class="btn btn--block" type="submit">Войти</button>
        </form>
        <div class="auth-link" style="background:#eef2ff;border:1px dashed #c7d2fe;border-radius:10px;padding:10px 12px;margin-top:14px;color:var(--ink)">
          💡 Подсказка: вход для администратора — <b>admin@ya.ru</b> / пароль <b>admin@ya.ru</b>
        </div>
      </div>`;
      document.getElementById("alform").addEventListener("submit", e=>{
        e.preventDefault();
        const u = document.getElementById("alogin").value.trim().toLowerCase();
        const p = document.getElementById("apass").value;
        if(window.adminCreds(u, p)){
          window.grantAdmin();
          initAdmin();
        } else {
          const m = document.getElementById("amsg");
          m.className = "form-msg show form-msg--err";
          m.textContent = "Неверный email или пароль";
        }
      });
    }

    // ---------- Панель администратора ----------
    function initAdmin(){
      wrap.innerHTML = `
        <h1 style="margin:0 0 8px">Админ-панель</h1>
        <p style="color:var(--muted);margin:0 0 20px">Управление товарами и заказами</p>
        <div class="sort-bar" style="margin-bottom:0">
          <button class="btn btn--sm tab-btn active" data-tab="products">Товары</button>
          <button class="btn btn--sm tab-btn" data-tab="orders">Заказы</button>
          <button class="btn btn--ghost btn--sm" style="margin-left:auto;background:#1a1d29" onclick="sessionStorage.removeItem('sc_admin');setCurrentUser(null);location.reload()">Выйти</button>
        </div>
        <div id="tab-products" class="tab-pane"></div>
        <div id="tab-orders" class="tab-pane" style="display:none"></div>`;

      document.querySelectorAll(".tab-btn").forEach(b=>b.addEventListener("click",()=>{
        document.querySelectorAll(".tab-btn").forEach(x=>x.classList.toggle("active", x===b));
        document.getElementById("tab-products").style.display = b.dataset.tab==="products"?"block":"none";
        document.getElementById("tab-orders").style.display = b.dataset.tab==="orders"?"block":"none";
      }));

      renderAdminProducts();
      renderAdminOrders();
    }

    // ---------- Товары: список + добавить (с фото) + редактировать/удалить ----------
    function filesToDataURLs(files, cb){
      const list = Array.from(files);
      if(!list.length) return cb([]);
      const out = []; let done = 0;
      const read = (i)=>{
        if(i >= list.length) return cb(out);
        const f = list[i];
        const img = new Image();
        const u = URL.createObjectURL(f);
        img.onload = ()=>{
          try{
            const max = 1000;
            let w = img.naturalWidth, h = img.naturalHeight;
            if(Math.max(w,h) > max){ const k = max/Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k); }
            const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
            cv.getContext("2d").drawImage(img, 0, 0, w, h);
            out.push(cv.toDataURL("image/jpeg", 0.8));
          }catch(e){ /* пропустить файл */ }
          URL.revokeObjectURL(u);
          done++; read(i+1);
        };
        img.onerror = ()=>{ done++; read(i+1); };
        img.src = u;
      };
      read(0);
    }
    function imgThumb(u, rmPath){
      return `<span style="position:relative"><img src="${u}" style="width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)">`+
        `<button type="button" style="position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;border:none;border-radius:50%;width:18px;height:18px;line-height:1;cursor:pointer" onclick="${rmPath}">×</button></span>`;
    }
    function renderAdminProducts(){
      if(window.loadProducts) loadProducts().then(()=>{
        const pane = document.getElementById("tab-products");
        window.__pending = [];
        pane.innerHTML = `
          <h2 style="font-size:20px;margin:20px 0 10px">Добавить товар</h2>
          <form id="addForm" class="auth-wrap" style="max-width:100%;padding:16px">
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px">
              <div class="field"><label>Название</label><input id="nName" required></div>
              <div class="field"><label>Категория</label><input id="nCat" placeholder="Гитары" required></div>
              <div class="field"><label>Цена, ₽</label><input id="nPrice" type="number" min="0" required></div>
              <div class="field"><label>Старая цена, ₽</label><input id="nOld" type="number" min="0" placeholder="0 = нет скидки"></div>
              <div class="field"><label>Иконка/эмодзи</label><input id="nIcon" value="🎸"></div>
            </div>
            <div class="field"><label>Загрузить фото товара (можно несколько)</label><input id="nFiles" type="file" accept="image/*" multiple></div>
            <div class="field"><label>Или ссылка на изображение (URL)</label><input id="nImg" placeholder="https://..."></div>
            <div id="nPrev" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px"></div>
            <button class="btn btn--block" type="submit">Добавить товар</button>
          </form>
          <div id="editWrap"></div>
          <h2 style="font-size:20px;margin:24px 0 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">Все товары (${PRODUCTS.length})
            <button class="btn btn--sm" style="background:var(--line);color:var(--ink)" onclick="resetCatalogChanges()">Сбросить локальные изменения каталога</button>
          </h2>
          <div style="overflow-x:auto">
            <table class="cart-table">
              <thead><tr><th>ID</th><th>Товар</th><th>Категория</th><th>Цена</th><th>Действия</th></tr></thead>
              <tbody>${PRODUCTS.map(prodRow).join("")}</tbody>
            </table></div>`;

        function renderPendingPrev(){
          document.getElementById("nPrev").innerHTML = window.__pending.map((u,i)=>imgThumb(u, "window.__pending.splice("+i+",1);renderPendingPrev()")).join("");
        }
        document.getElementById("nFiles").addEventListener("change", e=>{
          filesToDataURLs(e.target.files, urls=>{ window.__pending = urls; renderPendingPrev(); });
        });

        document.getElementById("addForm").addEventListener("submit", e=>{
          e.preventDefault();
          const url = document.getElementById("nImg").value.trim();
          const images = window.__pending.length ? window.__pending.slice() : (url ? [url] : []);
          window.addProduct({
            name: document.getElementById("nName").value.trim(),
            cat: document.getElementById("nCat").value.trim()||"Разное",
            price: +document.getElementById("nPrice").value || 0,
            oldPrice: +document.getElementById("nOld").value || null,
            icon: document.getElementById("nIcon").value || "🎸",
            img: images[0] || url || null, images,
            badge: null, desc: ""
          });
          toast("Товар добавлен в каталог");
          e.target.reset(); window.__pending=[]; document.getElementById("nPrev").innerHTML="";
          renderAdminProducts();
        });
      });
    }
    function prodRow(p){
      return `<tr>
        <td>${p.id}</td>
        <td><div class="cart-item"><div class="cart-item__thumb">${p.icon}${p.img?`<img src="${p.img}" alt="" loading="lazy" onerror="this.remove()">`:""}</div><span>${escapeHtml(p.name)}</span></div></td>
        <td>${escapeHtml(p.cat)}</td><td>${fmtPrice(p.price)}</td>
        <td style="white-space:nowrap">
          <button class="btn btn--sm" style="background:#eef2ff;color:var(--brand-dark);border:none" onclick="editProd(${p.id})">Изменить</button>
          <button class="btn btn--sm" style="background:#fee2e2;color:#b91c1c;border:none" onclick="delProd(${p.id})">Удалить</button>
        </td>
      </tr>`;
    }
    window.delProd = function(id){ window.deleteProduct(id); toast("Товар удалён"); renderAdminProducts(); };
    window.resetCatalogChanges = function(){
      localStorage.removeItem("sc_extra");
      localStorage.removeItem("sc_deleted");
      localStorage.removeItem("sc_edits");
      window.applyCatalog(window.BASE_PRODUCTS);
      renderAdminProducts();
      toast("Каталог восстановлен к исходному виду");
    };
    window.editProd = function(id){
      const p = PRODUCTS.find(x=>x.id===id); if(!p) return;
      const st = { imgs: (p.images && p.images.length ? p.images : (p.img ? [p.img] : [])).slice() };
      st.render = function(){ const el=document.getElementById("ePrev"); if(el) el.innerHTML = st.imgs.map((u,i)=>imgThumb(u,"window.__editState.remove("+i+")")).join(""); };
      st.remove = function(i){ st.imgs.splice(i,1); st.render(); };
      window.__editState = st;
      const w = document.getElementById("editWrap");
      w.innerHTML = `
        <h2 style="font-size:20px;margin:20px 0 10px">Редактирование товара #${id}</h2>
        <form id="editForm" class="auth-wrap" style="max-width:100%;padding:16px">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px">
            <div class="field"><label>Название</label><input id="eName" value="${escapeHtml(p.name)}"></div>
            <div class="field"><label>Категория</label><input id="eCat" value="${escapeHtml(p.cat)}"></div>
            <div class="field"><label>Цена, ₽</label><input id="ePrice" type="number" value="${p.price}"></div>
            <div class="field"><label>Старая цена, ₽</label><input id="eOld" type="number" value="${p.oldPrice||0}"></div>
            <div class="field"><label>Иконка</label><input id="eIcon" value="${escapeHtml(p.icon)}"></div>
          </div>
          <div class="field"><label>Изображения товара</label>
            <div id="ePrev" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px"></div>
            <input id="eFiles" type="file" accept="image/*" multiple>
          </div>
          <div class="field"><label>Добавить по ссылке (URL)</label><input id="eImg" placeholder="https://..."></div>
          <div class="sum-row" style="justify-content:flex-start">
            <button class="btn btn--sm" type="submit">Сохранить</button>
            <button class="btn btn--sm" style="background:var(--line);color:var(--ink)" type="button" onclick="document.getElementById('editWrap').innerHTML=''">Отмена</button>
          </div>
        </form>`;
      st.render();
      document.getElementById("eFiles").addEventListener("change", e=>{
        filesToDataURLs(e.target.files, urls=>{ st.imgs.push(...urls); st.render(); });
      });
      document.getElementById("editForm").addEventListener("submit", ev=>{
        ev.preventDefault();
        const u = document.getElementById("eImg").value.trim();
        if(u) st.imgs.push(u);
        const images = st.imgs.length ? st.imgs.slice() : [];
        window.addEdit(id, {
          name: document.getElementById("eName").value.trim(),
          cat: document.getElementById("eCat").value.trim() || p.cat,
          price: +document.getElementById("ePrice").value || 0,
          oldPrice: +document.getElementById("eOld").value || null,
          icon: document.getElementById("eIcon").value || p.icon,
          img: images[0] || p.img || null, images
        });
        toast("Изменения сохранены");
        w.innerHTML="";
        renderAdminProducts();
      });
    };

    // ---------- Заказы: список + смена статуса + уведомление клиенту ----------
    function renderAdminOrders(){
      const pane = document.getElementById("tab-orders");
      const orders = JSON.parse(localStorage.getItem("sc_orders")||"[]");
      if(!orders.length){ pane.innerHTML = `<div class="empty">Заказов пока нет.</div>`; return; }
      pane.innerHTML = `<div style="overflow-x:auto">
        <table class="cart-table">
          <thead><tr><th>№</th><th>Дата</th><th>Клиент</th><th>Состав</th><th>Сумма</th><th>Статус</th></tr></thead>
          <tbody>${orders.map((o,i)=>orderRow(o,i)).join("")}</tbody>
        </table></div>`;
    }
    const STATUSES = ["Новый","Подтверждён","Собран","Отправлен","Доставлен","Отменён"];
    function orderRow(o,i){
      const num = 1000+i+1;
      const st = o.status || "Новый";
      return `<tr>
        <td>${num}</td><td>${escapeHtml(o.date||"")}</td><td>${escapeHtml(o.name||"")}</td>
        <td>${(o.items||[]).map(it=>escapeHtml(it.name)+" ×"+it.qty).join("; ")}</td>
        <td>${fmtPrice(o.total||0)}</td>
        <td><select onchange="setStatus(${i},this.value)">
          ${STATUSES.map(s=>`<option value="${s}" ${s===st?"selected":""}>${s}</option>`).join("")}
        </select></td>
      </tr>`;
    }
    window.setStatus = function(i, st){
      const orders = JSON.parse(localStorage.getItem("sc_orders")||"[]");
      const o = orders[i]; if(!o) return;
      o.status = st;
      localStorage.setItem("sc_orders", JSON.stringify(orders));
      // уведомление клиенту (имитация email-уведомления)
      const notif = JSON.parse(localStorage.getItem("sc_notifications")||"[]");
      notif.push({ orderNo:1000+i+1, status:st, text:"Статус вашего заказа изменён на «"+st+"»", date:new Date().toLocaleString("ru-RU") });
      localStorage.setItem("sc_notifications", JSON.stringify(notif));
      toast("Статус обновлён, клиенту отправлено уведомление");
    };

    // ---------- запуск ----------
    if(window.isAdmin()) initAdmin(); else loginScreen();
  </script>
</body>
</html>
