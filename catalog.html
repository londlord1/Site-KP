<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — SoundCraft</title>
  <link rel="stylesheet" href="css/style.css?v=11">
</head>
<body>
  <section class="section">
    <div class="container">
      <h1 style="margin:0 0 8px">Каталог товаров</h1>
      <nav class="crumbs"><a href="index.html">Главная</a><span>·</span><span>Каталог</span></nav>
      <div class="catalog">
        <aside class="filters">
          <h3>Фильтры</h3>
          <div class="field">
            <label>Поиск</label>
            <input type="search" id="fSearch" placeholder="Гитара, микрофон...">
          </div>
          <div class="field">
            <label>Категория</label>
            <select id="fCat"></select>
          </div>
          <div class="field">
            <label>Цена от, ₽</label>
            <input type="number" id="fPriceFrom" min="0" step="500" placeholder="напр. 10000">
            <div id="priceHint" class="price-hint"></div>
          </div>
          <div class="field">
            <label>Цена до, ₽</label>
            <input type="number" id="fPriceTo" min="0" step="500" placeholder="напр. 30000">
          </div>
          <div class="field">
            <label>Сортировка</label>
            <select id="fSort">
              <option value="default">По умолчанию</option>
              <option value="price-asc">Сначала дешевле</option>
              <option value="price-desc">Сначала дороже</option>
              <option value="name">По алфавиту</option>
            </select>
          </div>
          <div class="field">
            <label>Рейтинг от</label>
            <select id="fRating">
              <option value="0">Любой</option>
              <option value="4">4 ★ и выше</option>
              <option value="4.5">4,5 ★ и выше</option>
            </select>
          </div>
          <label class="check-row"><input type="checkbox" id="fInStock"> Только в наличии</label>
          <button class="btn btn--sm" style="background:var(--line);color:var(--ink);box-shadow:none" onclick="resetFilters()">Сбросить</button>
        </aside>

        <div>
          <div class="sort-bar">
            <span class="result-hint" id="resultHint"></span>
          </div>
          <div class="grid grid--cards" id="productList"></div>
          <div class="empty" id="emptyState" style="display:none">По вашему запросу ничего не найдено. Попробуйте изменить фильтры.</div>
        </div>
      </div>
    </div>
  </section>

  <script src="js/data.js?v=11"></script>
  <script src="js/api.js?v=11"></script>
  <script src="js/main.js?v=11"></script>
  <script>
    renderPage("catalog.html");

    const catSelect = document.getElementById("fCat");
    catSelect.innerHTML = CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join("");

    const list = document.getElementById("productList");
    const hint = document.getElementById("resultHint");

    function filterProducts(){
      const search = document.getElementById("fSearch").value.trim().toLowerCase();
      const cat = document.getElementById("fCat").value;
      const from = moneyToNum(document.getElementById("fPriceFrom").value);
      const to = moneyToNum(document.getElementById("fPriceTo").value);
      const sort = document.getElementById("fSort").value;
      const ratingMin = parseFloat(document.getElementById("fRating").value)||0;
      const inStock = document.getElementById("fInStock").checked;

      let arr = PRODUCTS.filter(p=>{
        const okSearch = !search || p.name.toLowerCase().includes(search) || p.cat.toLowerCase().includes(search);
        const okCat = cat==="Все" || p.cat===cat;
        const okFrom = !from || p.price >= from;
        const okTo = !to || p.price <= to;
        const okRating = !ratingMin || (p.rating||0) >= ratingMin;
        const okStock = !inStock || (p.stock==null || p.stock>0);
        return okSearch && okCat && okFrom && okTo && okRating && okStock;
      });

      if(sort==="price-asc") arr = arr.sort((a,b)=>a.price-b.price);
      if(sort==="price-desc") arr = arr.sort((a,b)=>b.price-a.price);
      if(sort==="name") arr = arr.sort((a,b)=>a.name.localeCompare(b.name,"ru"));

      renderList(arr);
      saveFilters();
    }
    function saveFilters(){
      const p = new URLSearchParams();
      [["fSearch","fSearch"],["fCat","fCat"],["fPriceFrom","fPriceFrom"],["fPriceTo","fPriceTo"],["fSort","fSort"],["fRating","fRating"]].forEach(([,id])=>{
        const v = document.getElementById(id).value; if(v) p.set(id, v);
      });
      if(document.getElementById("fInStock").checked) p.set("fInStock","1");
      const qs = p.toString();
      history.replaceState(null, "", qs ? "?"+qs : location.pathname);
    }

    /* ==== Ленивая подгрузка товаров при прокрутке ==== */
    const BATCH = 9;
    let dataArr = [];
    let seen = 0;
    let sentinel = null;
    let sentinelObs = null;

    function makeSentinel(){
      const s = document.createElement("div");
      s.id = "loadSentinel";
      s.style.height = "1px";
      list.parentNode.appendChild(s);
      const obs = new IntersectionObserver((es)=>{
        if(es[0].isIntersecting) loadMore();
      }, {rootMargin: "320px"});
      obs.observe(s);
      return {s, obs};
    }

    function loadMore(){
      const slice = dataArr.slice(seen, seen + BATCH);
      if(slice.length) list.insertAdjacentHTML("beforeend", slice.map(cardHtml).join(""));
      seen += slice.length;
      if(sentinel){
        sentinel.s.style.display = (seen >= dataArr.length) ? "none" : "block";
      }
    }

    function renderList(arr){
      dataArr = arr;
      seen = 0;
      hint.textContent = `Найдено товаров: ${arr.length}`;
      list.innerHTML = "";
      const emptyEl = document.getElementById("emptyState");
      if(arr.length){
        emptyEl.style.display = "none";
        emptyEl.innerHTML = "";
      } else {
        emptyEl.style.display = "block";
        emptyEl.innerHTML = `<div class="empty-state"><div class="empty-ico">🎯</div>Товары не найдены.<br><button class="btn btn--sm" style="margin-top:14px" onclick="resetFilters()">Сбросить фильтры</button></div>`;
      }
      if(sentinelObs){ sentinelObs.disconnect(); sentinelObs = null; }
      if(sentinel){ sentinel.s.remove(); sentinel = null; }
      if(arr.length){ sentinel = makeSentinel(); loadMore(); }
    }

    function cardHtml(p){
      return `
      <article class="card">
        <a class="card__img" href="product.html?id=${p.id}">
          <span class="card__icon">${p.icon}</span>
          ${p.img?`<img class="card__photo" src="${p.img}" alt="${escapeHtml(p.name)}" loading="lazy" onerror="this.remove()">`:""}
          ${favBtn(p.id)}
          ${badgesHtml(p)}
        </a>
        <div class="card__body">
          <span class="card__cat">${escapeHtml(p.cat)}</span>
          <a class="card__name" href="product.html?id=${p.id}">${escapeHtml(p.name)}</a>
          <div class="card__price">${fmtPrice(p.price)} ${p.oldPrice?`<s class="card__old">${fmtPrice(p.oldPrice)}</s>`:""}</div>
          <div class="card__row">
            ${buyButton(p.id)}
            <a class="btn--view" href="product.html?id=${p.id}">Подробнее</a>
          </div>
        </div>
      </article>`;
    }

    window.resetFilters = function(){
      document.getElementById("fSearch").value="";
      document.getElementById("fCat").value="Все";
      document.getElementById("fPriceFrom").value="";
      document.getElementById("fPriceTo").value="";
      document.getElementById("fRating").value="0";
      document.getElementById("fInStock").checked=false;
      document.getElementById("priceHint").textContent="";
      document.getElementById("fSort").value="default";
      filterProducts();
    };

    ["fSearch","fPriceFrom","fPriceTo","fSort","fRating"].forEach(id=>
      document.getElementById(id).addEventListener("input", filterProducts));
    document.getElementById("fInStock").addEventListener("change", filterProducts);

    // При выборе категории поле «Цена от» = минимальная цена в этой категории
    document.getElementById("fCat").addEventListener("change", ()=>{
      const cat = document.getElementById("fCat").value;
      const hint = document.getElementById("priceHint");
      if(cat!=="Все"){
        const min = Math.min(...PRODUCTS.filter(p=>p.cat===cat).map(p=>p.price));
        document.getElementById("fPriceFrom").value = min;
        hint.textContent = "Мин. цена категории: " + fmtPrice(min);
      } else {
        document.getElementById("fPriceFrom").value = "";
        hint.textContent = "";
      }
      filterProducts();
    });

    // Начальная загрузка: показываем скелетоны, затем товары
    const emptyEl = document.getElementById("emptyState");
    emptyEl.style.display = "none";
    document.getElementById("productList").innerHTML = skeletonCards(6);
    loadProducts().then(()=>{
      fillSearchCats();
      catSelect.innerHTML = CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join("");
      // применить фильтры из URL (если переход назад/с ссылкой)
      const q = new URLSearchParams(location.search);
      [["fSearch","fSearch"],["fCat","fCat"],["fPriceFrom","fPriceFrom"],["fPriceTo","fPriceTo"],["fSort","fSort"],["fRating","fRating"]].forEach(([,id])=>{
        const v = q.get(id); if(v!=null) document.getElementById(id).value = v;
      });
      if(q.get("fInStock")==="1") document.getElementById("fInStock").checked = true;
      filterProducts();
    });
  </script>
</body>
</html>
